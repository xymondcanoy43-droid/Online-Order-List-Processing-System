
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Online Order List Processing System</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>Online Order List Processing System</h1>
            
        </div>

        <!-- Form Section -->
        <div class="card">

            <h2>Add New Order</h2>

            <div class="form-container">

                <input
                    type="text"
                    id="customerName"
                    placeholder="Enter Customer Name"
                />

                <input
                    type="text"
                    id="productName"
                    placeholder="Enter Product Name"
                />

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity"
                    min="1"
                />

                <input
                    type="number"
                    id="price"
                    placeholder="Price"
                    min="1"
                    step="0.01"
                />

                <button onclick="addOrder()">
                    Add Order
                </button>

            </div>

        </div>

        <!-- Search and Sort -->
        <div class="card">

            <h2>Search and Sort Orders</h2>

            <div class="search-container">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search Customer Name"
                />

                <button onclick="searchOrder()">
                    Search
                </button>

                <button onclick="displayOrders()">
                    Show All
                </button>

            </div>

            <div class="sort-container">

                <button onclick="sortByName()">
                    Sort by Name
                </button>

                <button onclick="sortByTotal()">
                    Sort by Total
                </button>

            </div>

        </div>

        <!-- Orders Table -->
        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="orderTableBody">

                    <!-- Orders will appear here -->

                </tbody>

            </table>

        </div>

        <!-- Total Sales -->
        <div class="total-box" id="totalSales">
            Total Sales: ₱0.00
        </div>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
